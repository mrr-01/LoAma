<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoAMA Assistant</title>

    <!-- DeepSeek Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Highlight.js Dark Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo">L</div>
                    <span class="brand-name">LoAMA</span>
                </div>
                <button id="newChatBtn" class="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <div class="history-section">
                <div class="history-label">Recent Chats</div>
                <div id="conversationsList" class="conversations-list">
                    <!-- Conversations render here -->
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar">VJ</div>
                <div class="user-details">
                    <span class="user-name">Victor Joseph</span>
                    <span class="user-status">Local Instance</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="model-select-wrapper">
                    <span class="status-dot"></span>
                    <select id="modelSelector" class="model-select">
                        <!-- Dynamically populated via loadModels() -->
                    </select>
                    <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </header>

            <div id="chatMessages" class="chat-messages">
                <!-- Messages stream here -->
            </div>

            <div class="input-wrapper">
                <!-- Interactive Command Suggestions Popup -->
                <div id="commandMenu" class="command-menu" style="display: none;"></div>

                <div class="input-box">
                    <textarea id="messageInput" placeholder="Message LoAMA... (type / for commands)" rows="1"></textarea>

                    <button id="sendBtn" title="Send message">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>

                    <button id="stopBtn" title="Stop generating" style="display: none;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        </svg>
                    </button>
                </div>
                <div class="disclaimer">LoAMA may generate incorrect info. Local LLM environment.</div>
            </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
