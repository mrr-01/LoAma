<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoAMA Assistant</title>

    <!-- DeepSeek Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Highlight.js Dark Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo">L</div>
                    <span class="brand-name">LoAMA</span>
                </div>
                <button id="newChatBtn" class="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <div class="history-section">
                <div class="history-label">Recent Chats</div>
                <div id="conversationsList" class="conversations-list">
                    <!-- Conversations render here -->
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar">VJ</div>
                <div class="user-details">
                    <span class="user-name">Victor Joseph</span>
                    <span class="user-status">Local Instance</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="model-select-wrapper">
                    <span class="status-dot"></span>
                    <select id="modelSelector" class="model-select">
                        <!-- Dynamically populated via loadModels() -->
                    </select>
                    <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </header>

            <div id="chatMessages" class="chat-messages">
                <!-- Messages stream here -->
            </div>

            <div class="input-wrapper">
                <!-- Interactive Command Suggestions Popup -->
                <div id="commandMenu" class="command-menu" style="display: none;"></div>
                <div id="attachedDocPill" class="doc-pill" style="display: none;">
                        <span id="docPillName">📄 filename.pdf</span>
                        <button id="removeDocBtn" type="button" title="Remove attachment">&times;</button>
                </div>

                <div class="input-wrapper">
                    <div class="input-box">
                        <!-- Document Pill -->
                        <div id="attachedDocPill" class="doc-pill" style="display: none;">
                            <span id="docPillName">📄 document.pdf</span>
                            <button id="removeDocBtn" type="button" title="Remove attachment">&times;</button>
                        </div>

                        <!-- Controls Row -->
                        <div class="input-controls-row">
                            <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" />

                            <button id="attachBtn" type="button" title="Attach PDF" class="attach-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                </svg>
                            </button>

                            <textarea id="messageInput" placeholder="Message LoAMA..." rows="1"></textarea>

                            <button id="sendBtn" title="Send message">...</button>
                            <button id="stopBtn" title="Stop generating" style="display: none;">...</button>
                        </div>
                    </div>
                </div>
                <div class="disclaimer">LoAMA may generate incorrect info. Local LLM environment.</div>
            </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
