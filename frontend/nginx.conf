server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS server
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and SSE streaming connections to backend container
    location /api/ {
        set $backend_target http://loama-backend:8000;
        proxy_pass $backend_target;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering & caching for SSE / LLM token streaming
        proxy_buffering off;
        proxy_cache off;

        # Extended timeouts for long prompt evaluation and token generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
